[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-env"
version = "1.0.0"
description = "AI-Powered Customer Support Ticket Resolution Environment for OpenEnv"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.115.6",
    "pydantic==2.10.6",
    "uvicorn==0.34.0",
    "requests==2.32.3",
    "openenv-core==0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]
inference = [
    "openai==2.30.0",
    "requests==2.32.3",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "server",
]

[tool.pyright]
extraPaths = [".", "openenv"]
